name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Allow the workflow to publish to Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; don't cancel a run that is already publishing.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # Pages must already be enabled (Settings -> Pages -> Source: GitHub
      # Actions). The action's `enablement: true` option cannot do it for
      # us: creating a Pages site is not permitted with GITHUB_TOKEN, which
      # fails with "Resource not accessible by integration".
      - uses: actions/configure-pages@v5

      # The site is plain static files, so the repo root ships as-is.
      # If a build step is added later, point `path` at its output directory.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v4
